name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final Oracle files
        run: npx prettier --write src/server/domain/buffettOracle.ts tests/profitability.test.ts
      - name: Pack exact formatted files
        run: |
          mkdir -p oracle-formatted/src/server/domain oracle-formatted/tests
          cp src/server/domain/buffettOracle.ts oracle-formatted/src/server/domain/buffettOracle.ts
          cp tests/profitability.test.ts oracle-formatted/tests/profitability.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-final-formatted
          path: oracle-formatted
      - run: exit 1
