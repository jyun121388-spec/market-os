name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market_os
          POSTGRES_PASSWORD: market_os_ci
          POSTGRES_DB: market_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://market_os:market_os_ci@localhost:5432/market_os?schema=public
      TEST_DB_URL: postgresql://market_os:market_os_ci@localhost:5432/market_os_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # TEMPORARY PR-ONLY diagnostic. It prints Prettier's exact patch so the branch can apply the
      # repository formatter without relying on an external formatter installation. This step is
      # removed immediately after the patch is captured and never belongs in the product branch.
      - name: Print exact Prettier patch for Oracle files
        run: |
          npx prettier --write src/app/oracle/page.tsx src/app/SiteNav.tsx src/server/domain/buffettOracle.ts
          git diff -- src/app/oracle/page.tsx src/app/SiteNav.tsx src/server/domain/buffettOracle.ts
          exit 1

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Create and migrate the disposable test database
        run: |
          PGPASSWORD=market_os_ci psql -h localhost -U market_os -d market_os \
            -c 'CREATE DATABASE market_os_test;'
          DATABASE_URL="$TEST_DB_URL" npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test suite (disposable database only)
        run: npm run test
        env:
          DATABASE_URL: ""
          TEST_DATABASE_URL: ${{ env.TEST_DB_URL }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the app and run the end-to-end walkthrough
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/login || {
            echo "app did not become ready within 60s"; exit 1;
          }
          npm run e2e
        env:
          NODE_ENV: production
          ADMIN_EMAILS: e2e-walkthrough@example.com
