name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/profitability.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-profitability-formatted
          path: tests/profitability.test.ts
      - run: exit 1
